[build-system]
requires = [
    "setuptools>=77.0.3",
    "setuptools_scm>=8",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "src/saltext/proxmox/version.py"
version_file_template = "__version__ = \"{version}\"\n"
fallback_version = "0.0.0"

[project]
name = "saltext.proxmox"
description = "Salt Extension for interacting with Proxmox PVE"
authors = [
    {name = "EITR Technologies, LLC", email = "devops@eitr.tech"},
]
keywords = [
    "salt-extension",
]
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">= 3.11"
dynamic = ["version"]
dependencies = [
    "requests>=2.2.1",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/salt-extensions/saltext-proxmox"
Documentation = "https://salt-extensions.github.io/saltext-proxmox/"
Source = "https://github.com/salt-extensions/saltext-proxmox"
Tracker = "https://github.com/salt-extensions/saltext-proxmox/issues"

# Salt is deliberately not a hard requirement: it is expected to be
# provided by the target environment (onedir, OS package). Declaring
# it as one would make pip resolve the preinstalled Salt's dependency
# metadata, attempting to replace environment-provided dependencies
# with PyPI releases or even upgrade Salt inside a onedir. The extra
# allows opting in for pip-managed environments.
[project.optional-dependencies]
salt = [
    "salt>=3006",
]

[dependency-groups]
dev_all = [
    {include-group = "dev_extra"},
    {include-group = "dev_required"},
    {include-group = "docs"},
    {include-group = "tests"},
]
dev_required = [
    "nox[uv]>=2026.07.11",
    "prek>=0.5.5 ; sys_platform == 'linux' or sys_platform == 'darwin' or sys_platform == 'win32'",
    "pre-commit>=3.0.0 ; sys_platform != 'linux' and sys_platform != 'darwin' and sys_platform != 'win32'",
]
# These dependencies are used in automations. It can be helpful
# to have them installed in the dev venv, e.g. for editor integration.
dev_extra = [
    "black==26.10.1",
    "isort==9.0.2",
    "coverage==7.17.0",
]
docs = [
  "sphinx",
  "sphinx-prompt",
  "sphinx-copybutton",
  "towncrier==26.9.0",
  "sphinxcontrib-towncrier",
  "myst_parser",
  "furo",
  "sphinx-inline-tabs",
]
docsauto = ["sphinx-autobuild", {include-group = "docs"}]
# coverage itself is installed separately to respect COVERAGE_REQUIREMENT
coverageauto = ["livereload"]
lint = [
    "pylint==4.1.3",
]
tests = [
    "pytest>=7.2.0",
    "pytest-salt-factories>=1.0.0",
    "pytest-instafail",
]

[project.entry-points."salt.loader"]
"saltext.proxmox" = "saltext.proxmox"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests"]

[tool.distutils.sdist]
owner = "root"
group = "root"

[tool.black]
line-length = 100

[tool.isort]
force_single_line = true
skip = ["src/saltext/proxmox/__init__.py"]
profile = "black"
line_length = 100

[tool.mdformat]
wrap = 70
# Requires Python 3.13, enforced in pre-commit config instead.
# exclude = [
#     "changelog/*",
#     "**/CHANGELOG.md",
#     "**/*.github*/**",
# ]

[tool.towncrier]
package = "saltext.proxmox"
# An explicit name keeps towncrier from importing the package,
# allowing it to run without the project installed (release automation).
name = "saltext.proxmox"
filename = "CHANGELOG.md"
template = "changelog/.template.jinja"
directory = "changelog/"
start_string = "# Changelog\n"
underlines = ["", "", ""]
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/salt-extensions/saltext-proxmox/issues/{issue})"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[tool.coverage.run]
branch = true
concurrency = ["multiprocessing"]
cover_pylib = false
parallel = true
relative_files = true

omit = [
    ".nox/*",
]

[tool.coverage.report]
ignore_errors = true

# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if False:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",

    # Add markers which exclude statements in between.
    # Requires coverage>=7.6.0.
    "no cover: start(?s:.)*?no cover: stop",
]

omit = [
    ".nox/*",
]

[tool.coverage.paths]
source = [
    "saltext/proxmox",
    "src/saltext/proxmox",
]
testsuite = [
    "tests/",
]

[tool.pylint]
jobs = 0
py-version = "3.11"
source-roots = ["src"]
disable = [
    "consider-using-f-string",
    "duplicate-code",
    "fixme",
    "inconsistent-return-statements",
    "keyword-arg-before-vararg",
    "line-too-long",
    "logging-fstring-interpolation",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "no-else-return",
    "no-member",
    "protected-access",
    "redefined-argument-from-local",
    "redefined-builtin",
    "redefined-outer-name",
    "too-few-public-methods",
    "too-many-boolean-expressions",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-statements",
    "ungrouped-imports",
    "wrong-import-position"
]
enable = ["c-extension-no-member"]

[tool.pylint.design]
max-args = 35
max-attributes = 15
max-bool-expr = 8
max-branches = 48
max-locals = 40
max-public-methods = 25
max-returns = 10
max-statements = 100

[tool.pylint.format]
expected-line-ending-format = "LF"
max-line-length = 120
max-module-lines = 3000

[tool.pylint.miscellaneous]
check-fixme-in-docstring = true

[tool.pylint.variables]
additional-builtins = [
    "__active_provider_name__",
    "__context__",
    "__env__",
    "__events__",
    "__executors__",
    "__ext_pillar__",
    "__file_client__",
    "__grains__",
    "__instance_id__",
    "__jid__",
    "__jid_event__",
    "__low__",
    "__lowstate__",
    "__minion__",
    "__opts__",
    "__pillar__",
    "__proxy__",
    "__reg__",
    "__resource__",
    "__resource_funcs__",
    "__ret__",
    "__runner__",
    "__runners__",
    "__running__",
    "__salt__",
    "__salt_system_encoding__",
    "__sdb__",
    "__serializers__",
    "__states__",
    "__tag__",
    "__thorium__",
    "__user__",
]

# While we currently don't use ruff for linting, it's helpful to include
# these settings in case a user has setup ruff in their editor environment.
[tool.ruff]
builtins = [
    "__active_provider_name__",
    "__context__",
    "__env__",
    "__events__",
    "__executors__",
    "__ext_pillar__",
    "__file_client__",
    "__grains__",
    "__instance_id__",
    "__jid__",
    "__jid_event__",
    "__low__",
    "__lowstate__",
    "__minion__",
    "__opts__",
    "__pillar__",
    "__proxy__",
    "__reg__",
    "__resource__",
    "__resource_funcs__",
    "__ret__",
    "__runner__",
    "__runners__",
    "__running__",
    "__salt__",
    "__salt_system_encoding__",
    "__sdb__",
    "__serializers__",
    "__states__",
    "__tag__",
    "__thorium__",
    "__user__",
]

[tool.ruff.lint.isort]
force-single-line = true
