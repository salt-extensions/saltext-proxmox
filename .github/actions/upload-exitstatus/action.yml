---
name: upload-exitstatus
description: Upload a job's status as an artifact
inputs:
  artifact_prefix:
    required: false
    default: exitstatus-
  name:
    required: false
    default: ''

runs:
  using: composite

  steps:

      - name: Set Exit Status
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
          OUTFILE: exitstatus/${{ inputs.name == '' && github.job || inputs.name }}
        shell: bash
        run: |
          mkdir exitstatus
          echo "${JOB_STATUS}" > "$OUTFILE"

      - name: Upload Exit Status
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ inputs.artifact_prefix }}${{ inputs.name == '' && github.job || inputs.name }}
          path: exitstatus
          if-no-files-found: error
