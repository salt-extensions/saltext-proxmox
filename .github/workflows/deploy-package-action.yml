# Publishes verified Python distributions to PyPI.
#
# This workflow is registered as the PyPI Trusted Publisher.
# Any job in this file with `id-token: write` and the configured
# environment can potentially obtain PyPI publishing credentials.
#
# Only the publish job receives OIDC permissions.
# No repository code is executed in the publishing job.
#
# The triggering workflow must be initiate-release.yml, which
# independently authorizes releases and builds the artifacts.
# `workflow_run` workflows always execute the default branch's
# definition and artifacts can only be uploaded by a run itself,
# so verifying the triggering run's identity (path + event) makes
# its artifacts trustworthy.
---
name: Release Salt Extension Python Package

on:
  # zizmor: ignore[dangerous-triggers]
  # `workflow_run` selects triggering runs by display name only, which a pull
  # request can claim by adding a `pull_request`-triggered workflow of the same
  # name. The trigger alone therefore grants no trust - the `verify` job below
  # verifies the triggering run's provenance before anything is touched.
  workflow_run:
    types:
      - completed
    workflows:
      - Initiate Release

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

cache-mode: none
permissions: {}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-26.04

    # Only accept successful runs of the actual release initiation workflow,
    # identified by its file path and trigger, never by name alone. A pull
    # request cannot forge the `workflow_run` event: such workflows only ever
    # execute the default branch's definition.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.path == '.github/workflows/initiate-release.yml' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch

    permissions:
      actions: read   # List release artifacts and download them from different run
      contents: read  # Resolve the release tag via the API

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      INITIATE_RUN_ID: ${{ github.event.workflow_run.id }}

    outputs:
      version: ${{ steps.manifest.outputs.version }}
      commit: ${{ steps.manifest.outputs.commit }}
      tag: ${{ steps.manifest.outputs.tag }}

    steps:
      # The triggering workflow also completes successfully when all its
      # jobs were skipped, e.g. because it was triggered by an unrelated
      # or unauthorized workflow run. In that case, there is no release.
      - name: Check triggering workflow for release manifest
        id: check
        run: |
          set -euo pipefail

          artifacts="$(gh api --paginate \
            "repos/${GH_REPO}/actions/runs/${INITIATE_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false).name')"

          if grep -qx 'release-manifest' <<< "$artifacts"; then
            echo "available=1" >> "$GITHUB_OUTPUT"
          else
            echo "available=0" >> "$GITHUB_OUTPUT"
            echo "::notice::No release manifest found, assuming the triggering run did not initiate a release."
          fi

      - name: Download release manifest
        if: steps.check.outputs.available == '1'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-manifest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release

      - name: Verify release manifest
        if: steps.check.outputs.available == '1'
        id: manifest
        env:
          MANIFEST: ${{ runner.temp }}/release/manifest.json
        run: |
          set -euo pipefail

          # The manifest must describe a release initiated by the exact
          # triggering run.
          jq -e \
            --arg repo "$GH_REPO" \
            --argjson run_id "$INITIATE_RUN_ID" '
            .schema_version == 1
            and .repository == $repo
            and .initiate_run_id == $run_id
            and (.version | type == "string")
            and (.tag | type == "string")
            and (.commit | type == "string")
          ' "$MANIFEST" > /dev/null

          version="$(jq -er '.version' "$MANIFEST")"
          tag="$(jq -er '.tag' "$MANIFEST")"
          commit="$(jq -er '.commit' "$MANIFEST")"

          # Validate release naming.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$tag" == "v${version}" ]] || exit 1

          # Require a complete commit SHA.
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || exit 1

          # Retrieve the exact Git reference.
          ref="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}")"

          [[ "$(jq -r '.ref' <<< "$ref")" == "refs/tags/${tag}" ]] || {
            echo "::error::Unexpected Git reference"
            exit 1
          }

          sha="$(jq -er '.object.sha' <<< "$ref")"
          type="$(jq -er '.object.type' <<< "$ref")"

          # Dereference annotated tags.
          for _ in 1 2 3 4; do
            [[ "$type" == "tag" ]] || break

            object="$(gh api "repos/${GH_REPO}/git/tags/${sha}")"
            sha="$(jq -er '.object.sha' <<< "$object")"
            type="$(jq -er '.object.type' <<< "$object")"
          done

          [[ "$type" == "commit" ]] || {
            echo "::error::Release tag does not resolve to a commit"
            exit 1
          }

          # The release tag must still reference the authorized commit.
          [[ "$sha" == "$commit" ]] || {
            echo "::error::Release tag has changed since initiation"
            exit 1
          }

          echo "Verified release: $tag ($commit)"

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release handoff
        # Consumed by finalize-release.yml, which handles the
        # remaining release steps after the packages were published.
        if: steps.check.outputs.available == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-handoff
          path: ${{ runner.temp }}/release/manifest.json
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-26.04
    # Skip when the triggering workflow did not initiate a release.
    if: needs.verify.outputs.version != ''

    environment:
      name: release
      url: https://pypi.org/p/saltext.proxmox

    permissions:
      actions: read    # Download artifact from the triggering run
      id-token: write  # Trusted Publishing

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: salt-extension-packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          attestations: true
          verbose: ${{ runner.debug == '1' }}

  # The GitHub release and the docs deployment run separately on
  # `workflow_run` in finalize-release.yml.
