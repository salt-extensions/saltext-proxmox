---
name: Pre-Commit

on:
  workflow_call:
    inputs:
      changed-files:
        required: true
        type: string
        description: JSON string containing information about changed files
      checkout-ref:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  Pre-Commit:
    name: Pre-Commit
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/salt-extensions/prek-ci:3.14.9@sha256:278fbae16dd0b40ef98109820870d41c8cb144e1d40e2651381147ebd14c9e23

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: Cache Hook Environments
        # Release builds must not use cached environments. Enforced
        # service-side via `cache-mode: none` in the release workflows,
        # the tag ref check is an extra caller-independent safeguard.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # prek redirects UV_CACHE_DIR into its own cache, even in the nox lint sessions.
          # The actionlint hook's shellcheck wrapper caches its native binary separately.
          path: |-
            ~/.cache/prek
            ~/.cache/rshellcheck
          # Include the container digest to avoid restoring hook envs
          # built against a different Python installation.
          key: prek-278fbae16dd0-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install Prek Hooks
        run: |
          prek install-hooks

      - name: Check ALL Files On Branch
        if: github.event_name != 'pull_request' || fromJSON(inputs.changed-files)['pre-commit'] == 'true'
        env:
          # Enables zizmor's online audits (e.g. verifying that pinned action
          # commits exist upstream). Also provides auth for `gh`-based release
          # provenance verification where the gh CLI is available.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prek run --show-diff-on-failure --color=always --all-files

      - name: Check Changed Files On PR
        # Skip when the previous step already checked all files
        if: github.event_name == 'pull_request' && fromJSON(inputs.changed-files)['repo'] == 'true' && fromJSON(inputs.changed-files)['pre-commit'] != 'true'
        shell: bash
        env:
          CHANGED_FILES: ${{ fromJSON(inputs.changed-files)['repo_files'] }}
          # See `Check ALL Files On Branch`
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' -t files < <(jq -j '.[] | "./", ., "\u0000"' <<< "$CHANGED_FILES")
          prek run --show-diff-on-failure --color=always --files "${files[@]}"

      - name: Prune Caches
        if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          uv cache prune --ci --cache-dir "$(prek cache dir)/cache/uv"
          prek cache gc

      - name: Upload Exit Status
        if: ${{ !cancelled() }}
        uses: $/.github/actions/upload-exitstatus
