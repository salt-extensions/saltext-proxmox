---
name: Testing

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: false
        type: string
        default: ''

permissions: {}

jobs:

  Linux:
    name: Linux Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # codecov upload

    env:
      SALT_REQUIREMENT: salt==${{ matrix.salt-version }}
      VENV_PYTHON: ${{ matrix.python-version }}

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {salt-version: "3006.29", python-version: "3.11"}
          - {salt-version: "3008.4", python-version: "3.14"}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 2  # coverage: Issue detecting commit SHA
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Nox
        run: |
          pip install "nox==${NOX_VERSION}" "uv==${UV_VERSION}"
        env:
          NOX_VERSION: '2026.10.20'
          UV_VERSION: '0.13.5'

      - name: Configure uv Cache Location
        # `runner.temp` is not available in job-level `env` definitions
        shell: bash
        run: echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "$GITHUB_ENV"

      - name: Cache uv Wheels
        # Release builds must not use cached environments
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-salt${{ matrix.salt-version }}-${{ hashFiles('pyproject.toml', 'noxfile.py') }}
          restore-keys: |-
            uv-${{ runner.os }}-py${{ matrix.python-version }}-salt${{ matrix.salt-version }}-

      - name: Install Test Requirements
        run: |
          nox --force-color -e test --install-only

      - name: Prune uv Cache
        # Release builds must not use cached environments
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: uv cache prune --ci

      - name: Test
        env:
          SKIP_REQUIREMENTS_INSTALL: '1'
        run: |
          nox --force-color -e test -- -vv --instafail tests/

      - name: Create Codecov Flags
        id: codecov-flags
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SALT_VERSION: ${{ matrix.salt-version }}
        run: |
          salt_version="${SALT_VERSION%%.*}"
          # ${GITHUB_JOB,,} requires bash 4+, but macOS runners ship bash 3.2
          os="$(tr '[:upper:]' '[:lower:]' <<< "$GITHUB_JOB")"
          os="${os//-/_}"

          echo "project=project,project_${os},project_salt_${salt_version}" >> "$GITHUB_OUTPUT"
          echo "tests=tests,tests_${os},tests_salt_${salt_version}" >> "$GITHUB_OUTPUT"

      - name: Upload Project Code Coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: artifacts/coverage-project.xml
          disable_search: true
          fail_ci_if_error: false
          handle_no_reports_found: true
          flags: ${{ steps.codecov-flags.outputs.project }}
          name: ${{ github.job }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}-project
          use_oidc: true
          version: v11.3.1

      - name: Upload Tests Code Coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: artifacts/coverage-tests.xml
          disable_search: true
          fail_ci_if_error: false
          handle_no_reports_found: true
          flags: ${{ steps.codecov-flags.outputs.tests }}
          name: ${{ github.job }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}-tests
          use_oidc: true
          version: v11.3.1

      - name: Upload Logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: runtests-${{ github.job }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}.log
          path: artifacts/runtests-*.log

      - name: Upload Exit Status
        if: ${{ !cancelled() }}
        uses: $/.github/actions/upload-exitstatus
        with:
          name: ${{ github.job }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}

  Windows:
    name: Windows Tests
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write  # codecov upload

    env:
      SALT_REQUIREMENT: salt==${{ matrix.salt-version }}
      VENV_PYTHON: ${{ matrix.python-version }}

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {salt-version: "3006.29", python-version: "3.11"}
          - {salt-version: "3008.4", python-version: "3.14"}

    steps:
      - name: Disable Windows Defender Real-time Monitoring
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 2  # coverage: Issue detecting commit SHA
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Nox
        shell: bash
        run: |
          pip install "nox==${NOX_VERSION}" "uv==${UV_VERSION}"
        env:
          NOX_VERSION: '2026.10.20'
          UV_VERSION: '0.13.5'

      - name: Configure uv Cache Location
        # `runner.temp` is not available in job-level `env` definitions
        shell: bash
        run: echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "$GITHUB_ENV"

      - name: Cache uv Wheels
        # Release builds must not use cached environments
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-salt${{ matrix.salt-version }}-${{ hashFiles('pyproject.toml', 'noxfile.py') }}
          restore-keys: |-
            uv-${{ runner.os }}-py${{ matrix.python-version }}-salt${{ matrix.salt-version }}-

      - name: Install Test Requirements
        shell: bash
        run: |
          nox --force-color -e test --install-only

      - name: Prune uv Cache
        # Release builds must not use cached environments
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: uv cache prune --ci

      - name: Test
        shell: bash
        env:
          SKIP_REQUIREMENTS_INSTALL: '1'
        run: |
          nox --force-color -e test -- -vv --instafail tests/

      - name: Create Codecov Flags
        id: codecov-flags
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SALT_VERSION: ${{ matrix.salt-version }}
        run: |
          salt_version="${SALT_VERSION%%.*}"
          # ${GITHUB_JOB,,} requires bash 4+, but macOS runners ship bash 3.2
          os="$(tr '[:upper:]' '[:lower:]' <<< "$GITHUB_JOB")"
          os="${os//-/_}"

          echo "project=project,project_${os},project_salt_${salt_version}" >> "$GITHUB_OUTPUT"
          echo "tests=tests,tests_${os},tests_salt_${salt_version}" >> "$GITHUB_OUTPUT"

      - name: Upload Project Code Coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: artifacts/coverage-project.xml
          disable_search: true
          fail_ci_if_error: false
          handle_no_reports_found: true
          flags: ${{ steps.codecov-flags.outputs.project }}
          name: ${{ github.job }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}-project
          use_oidc: true
          version: v11.3.1

      - name: Upload Tests Code Coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: artifacts/coverage-tests.xml
          disable_search: true
          fail_ci_if_error: false
          handle_no_reports_found: true
          flags: ${{ steps.codecov-flags.outputs.tests }}
          name: ${{ github.job }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}-tests
          use_oidc: true
          version: v11.3.1

      - name: Upload Logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: runtests-${{ github.job }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}.log
          path: artifacts/runtests-*.log

      - name: Upload Exit Status
        if: ${{ !cancelled() }}
        uses: $/.github/actions/upload-exitstatus
        with:
          name: ${{ github.job }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}

  macOS:
    name: macOS Tests
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write  # codecov upload

    env:
      SALT_REQUIREMENT: salt==${{ matrix.salt-version }}
      VENV_PYTHON: ${{ matrix.python-version }}

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {salt-version: "3006.29", python-version: "3.11"}
          - {salt-version: "3008.4", python-version: "3.14"}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 2  # coverage: Issue detecting commit SHA
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Nox
        run: |
          pip install "nox==${NOX_VERSION}" "uv==${UV_VERSION}"
        env:
          NOX_VERSION: '2026.10.20'
          UV_VERSION: '0.13.5'

      - name: Configure uv Cache Location
        # `runner.temp` is not available in job-level `env` definitions
        shell: bash
        run: echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "$GITHUB_ENV"

      - name: Cache uv Wheels
        # Release builds must not use cached environments
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-salt${{ matrix.salt-version }}-${{ hashFiles('pyproject.toml', 'noxfile.py') }}
          restore-keys: |-
            uv-${{ runner.os }}-py${{ matrix.python-version }}-salt${{ matrix.salt-version }}-

      - name: Install Test Requirements
        run: |
          nox --force-color -e test --install-only

      - name: Prune uv Cache
        # Release builds must not use cached environments
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: uv cache prune --ci

      - name: Test
        env:
          SKIP_REQUIREMENTS_INSTALL: '1'
        # Salt daemons stall during startup when run unprivileged on
        # macOS 15+ runner images (mDNS blocked for non-root processes)
        run: |
          sudo git config --system --add safe.directory '*'
          sudo -E env "PATH=$PATH" nox --force-color -e test -- -vv --instafail tests/

      - name: Restore File Ownership
        # The sudo'd test run leaves root-owned files behind (package
        # caches, uv tool dirs, artifacts, temp dirs), breaking later
        # steps - and workflow extensions - running unprivileged.
        if: ${{ !cancelled() }}
        run: |
          sudo find -H "$HOME" "${TMPDIR:-/tmp}" /tmp -mindepth 1 -user root -exec chown -h "$(id -u):$(id -g)" {} +

      - name: Create Codecov Flags
        id: codecov-flags
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SALT_VERSION: ${{ matrix.salt-version }}
        run: |
          salt_version="${SALT_VERSION%%.*}"
          # ${GITHUB_JOB,,} requires bash 4+, but macOS runners ship bash 3.2
          os="$(tr '[:upper:]' '[:lower:]' <<< "$GITHUB_JOB")"
          os="${os//-/_}"

          echo "project=project,project_${os},project_salt_${salt_version}" >> "$GITHUB_OUTPUT"
          echo "tests=tests,tests_${os},tests_salt_${salt_version}" >> "$GITHUB_OUTPUT"

      - name: Upload Project Code Coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: artifacts/coverage-project.xml
          disable_search: true
          fail_ci_if_error: false
          handle_no_reports_found: true
          flags: ${{ steps.codecov-flags.outputs.project }}
          name: ${{ github.job }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}-project
          use_oidc: true
          version: v11.3.1

      - name: Upload Tests Code Coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: artifacts/coverage-tests.xml
          disable_search: true
          fail_ci_if_error: false
          handle_no_reports_found: true
          flags: ${{ steps.codecov-flags.outputs.tests }}
          name: ${{ github.job }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}-tests
          use_oidc: true
          version: v11.3.1

      - name: Upload Logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: runtests-${{ github.job }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}.log
          path: artifacts/runtests-*.log

      - name: Upload Exit Status
        if: ${{ !cancelled() }}
        uses: $/.github/actions/upload-exitstatus
        with:
          name: ${{ github.job }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}
