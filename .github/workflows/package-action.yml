---
name: Build Salt Extension Python Package

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: false
        type: string
        default: ''
      require-in-branch:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build Python Packages (wheel and sdist)
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce ref being in branch
        if: ${{ inputs.require-in-branch != '' }}
        env:
          BRANCH_NAME: ${{ inputs.require-in-branch }}
          CHECK_REF: ${{ inputs.checkout-ref || github.sha }}
        run: git merge-base --is-ancestor "$CHECK_REF" "origin/$BRANCH_NAME"

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install build tools
        run: python -m pip install build --user

      - name: Build Wheel
        run: python -m build --outdir "$RUNNER_TEMP/dist"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: salt-extension-packages
          path: ${{ runner.temp }}/dist/
          retention-days: 5
          if-no-files-found: error

      - name: Upload Exit Status
        if: ${{ !cancelled() }}
        uses: $/.github/actions/upload-exitstatus
