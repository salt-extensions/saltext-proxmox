# Creates a new release.
# Triggered by pushing a tag beginning with `v`.
# The resulting version is taken from the tag.
# Fails if any news fragments are left over or the inferred version does not match the topmost changelog entry.
#
# Alternative to releasing by merging the autorelease PR.
---
name: Tagged Releases

on:
  push:
    tags:
      - "v*"  # Only tags starting with "v" for "v1.0.0", etc.

cache-mode: none

concurrency:
  # Guard against duplicate runs for the same tag (e.g. after deleting
  # and re-pushing it). Never cancel a release in progress.
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  get_version_tag:
    name: Extract version from tag
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version_tag.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version from tag name
        id: get_version_tag
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid version: $version"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Ensure changelog was rendered
        env:
          VERSION: ${{ steps.get_version_tag.outputs.version }}
        run: |
          test "$VERSION" = "$(python tools/version.py)" && \
          test -z "$(find changelog -type f -not -name '.*' -print -quit)"

  close_autopr_on_tag:
    name: Close release PR on manual tag
    runs-on: ubuntu-26.04
    permissions:
      contents: write       # Delete autorelease branch
      pull-requests: write  # Close autorelease PR
    needs:
      - get_version_tag

    steps:
      - name: Find Pull Request
        uses: juliangruber/find-pull-request-action@0d2ca757412e2742b5cd5ce4ff56757c65652605  # v1.12.0
        id: find-pull-request
        with:
          branch: release/auto
          base: ${{ github.event.repository.default_branch }}
          state: open

      - name: Close release PR
        if: steps.find-pull-request.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.find-pull-request.outputs.number }}
          VERSION_TAG: ${{ needs.get_version_tag.outputs.version }}
        run: |
          gh pr close \
            --comment "This release was triggered manually as v${VERSION_TAG}" \
            --delete-branch \
            --repo "$GITHUB_REPOSITORY" \
            "${PR_NUMBER}"

  # Further jobs are run separately on `workflow_run` in initiate-release.yml
