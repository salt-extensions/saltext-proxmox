# Validates release requests and builds the Python distributions
# and documentation from the authorized tagged commit.
---
name: Initiate Release

on:
  # zizmor: ignore[dangerous-triggers]
  # The triggering workflows are untrusted. Authorization relies only on
  # GitHub-generated workflow_run metadata and independently verified
  # repository state.
  # We don't use any artifacts generated by the triggering runs, everything
  # is built from the validated tagged commit.
  workflow_run:
    types:
      - completed
    workflows:
      # Without a push secret, merging the autorelease PR cannot cause
      # a tag push event, so the release pipeline starts from the
      # `Auto PR Releases` run itself.
      - Auto PR Releases
      - Tagged Releases

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

cache-mode: none
permissions: {}

jobs:
  authorize:
    name: Authorize release
    runs-on: ubuntu-26.04

    # Only accept runs of the expected release workflows, identified by their
    # file path and trigger, never by name alone. This does not trust the
    # triggering workflow's logic - the release is authorized independently
    # below, based on repository state alone.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        (
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.path == '.github/workflows/tag-auto.yml' &&
          github.event.workflow_run.head_branch == 'release/auto'
        ) ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.path == '.github/workflows/tag.yml' &&
          startsWith(github.event.workflow_run.head_branch, 'v')
        )
      )

    permissions:
      contents: read

    outputs:
      version: ${{ steps.verify.outputs.version }}
      commit: ${{ steps.verify.outputs.commit }}
      tag: ${{ steps.verify.outputs.tag }}

    steps:
      - name: Verify release authorization
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_REF: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          case "$TRIGGER_EVENT" in
            push)
              tag="$TRIGGER_REF"
              expected_sha="$TRIGGER_SHA"
              ;;

            pull_request)
              # Find merged PRs associated with the triggering commit.
              prs="$(gh api --paginate \
                "repos/${GH_REPO}/commits/${TRIGGER_SHA}/pulls?per_page=100")"

              # Independently identify the authorized release PR.
              pr="$(jq -sec \
                --arg repo "$GH_REPO" \
                --arg branch "$DEFAULT_BRANCH" '
                [
                  .[][]
                  | select(
                      .state == "closed"
                      and .merged_at != null
                      and .head.repo.full_name == $repo
                      and .head.ref == "release/auto"
                      and .base.repo.full_name == $repo
                      and .base.ref == $branch
                      and any(.labels[]; .name == "release")
                      and (.title | test(
                        "^Release v[0-9]+\\.[0-9]+\\.[0-9]+$"
                      ))
                    )
                ]
                | if length == 1 then .[0] else empty end
              ' <<< "$prs")"

              expected_sha="$(jq -er '.merge_commit_sha' <<< "$pr")"
              tag="$(jq -er '.title | sub("^Release "; "")' <<< "$pr")"
              ;;

            *)
              echo "::error::Unexpected triggering event"
              exit 1
              ;;
          esac

          # Validate release tag syntax.
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid release tag: $tag"
            exit 1
          }

          version="${tag#v}"

          # Resolve the Git reference.
          ref="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}")"

          [[ "$(jq -r '.ref' <<< "$ref")" == "refs/tags/${tag}" ]] || exit 1

          sha="$(jq -er '.object.sha' <<< "$ref")"
          type="$(jq -er '.object.type' <<< "$ref")"

          # Dereference annotated tags.
          for _ in 1 2 3 4; do
            [[ "$type" == "tag" ]] || break

            object="$(gh api "repos/${GH_REPO}/git/tags/${sha}")"
            sha="$(jq -er '.object.sha' <<< "$object")"
            type="$(jq -er '.object.type' <<< "$object")"
          done

          [[ "$type" == "commit" ]] || exit 1

          # The release tag must point to the authorized commit.
          [[ "$sha" == "$expected_sha" ]] || {
            echo "::error::Release tag does not match authorized commit"
            exit 1
          }

          echo "Authorized release: $tag ($sha)"

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "commit=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release manifest
        env:
          RELEASE_VERSION: ${{ steps.verify.outputs.version }}
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.verify.outputs.commit }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/release"

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg version "$RELEASE_VERSION" \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" \
            --argjson run_id "$GITHUB_RUN_ID" '
            {
              schema_version: 1,
              repository: $repository,
              version: $version,
              tag: $tag,
              commit: $commit,
              initiate_run_id: $run_id
            }
          ' > "$RUNNER_TEMP/release/manifest.json"

      - name: Upload release manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-manifest
          path: ${{ runner.temp }}/release/manifest.json
          if-no-files-found: error

  build-package:
    name: Build Python Release Package
    needs: authorize
    uses: $/.github/workflows/package-action.yml
    with:
      checkout-ref: ${{ needs.authorize.outputs.commit }}
      require-in-branch: ${{ github.event.repository.default_branch }}
    permissions:
      contents: read

  build-docs:
    name: Build Release Docs
    needs: authorize
    uses: $/.github/workflows/docs-action.yml
    with:
      checkout-ref: ${{ needs.authorize.outputs.commit }}
      require-in-branch: ${{ github.event.repository.default_branch }}
      pages-artifact: true
    permissions:
      contents: read

  validate-artifacts:
    # This gates publishing: deploy-package-action.yml requires the run to
    # conclude successfully, which this job prevents unless the builds and
    # the validation below passed. The explicit result checks ensure this
    # even if a future condition allows skipping a build job, which would
    # otherwise still let the run conclude successfully.
    name: Validate Release Artifacts
    needs:
      - authorize
      - build-package
      - build-docs

    # Run even if the build jobs were skipped, but only for
    # authorized releases.
    if: ${{ !cancelled() && needs.authorize.result == 'success' }}

    runs-on: ubuntu-26.04
    permissions:
      actions: read   # Download built distributions from this run
      contents: read  # Fetch the pinned validation dependencies

    steps:
      - name: Verify build jobs
        env:
          PACKAGE_RESULT: ${{ needs.build-package.result }}
          DOCS_RESULT: ${{ needs.build-docs.result }}
        run: |
          set -euo pipefail

          [[ "$PACKAGE_RESULT" == "success" ]] || {
            echo "::error::Package build did not succeed"
            exit 1
          }

          [[ "$DOCS_RESULT" == "success" ]] || {
            echo "::error::Documentation build did not succeed"
            exit 1
          }

      - name: Download Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: salt-extension-packages
          path: ${{ runner.temp }}/dist

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install "packaging==25.0"

      - name: Verify Python distributions
        env:
          EXPECTED_NAME: 'saltext.proxmox'
          EXPECTED_VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from pathlib import Path

          from packaging.utils import (
              canonicalize_name,
              parse_sdist_filename,
              parse_wheel_filename,
          )
          from packaging.version import Version

          dist = Path(os.environ["RUNNER_TEMP"]) / "dist"
          expected_version = Version(os.environ["EXPECTED_VERSION"])
          expected_name = canonicalize_name(os.environ["EXPECTED_NAME"])

          files = sorted(dist.iterdir())
          if not files:
              raise ValueError("No distribution files found")

          wheels = [f for f in files if f.suffix == ".whl"]
          sdists = [f for f in files if f.name.endswith(".tar.gz")]
          if not wheels:
              raise ValueError("Expected at least one wheel")
          if len(sdists) != 1:
              raise ValueError("Expected exactly one sdist")
          if len(wheels) + len(sdists) != len(files):
              raise ValueError("Unexpected distribution files")

          for path in wheels:
              name, version, _, _ = parse_wheel_filename(path.name)
              if name != expected_name or version != expected_version:
                  raise ValueError(f"Unexpected wheel: {path.name}")

          for path in sdists:
              name, version = parse_sdist_filename(path.name)
              if name != expected_name or version != expected_version:
                  raise ValueError(f"Unexpected sdist: {path.name}")

          print(
              f"Verified {len(files)} distributions "
              f"for {expected_name} {expected_version}"
          )
          PY
